[tool.pytest.ini_options]
pythonpath = [".", "services/auth", "services/ingestion", "services/retrieval", "services/gateway", "evaluation"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::UserWarning:qdrant_client.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]          # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.File", "fastapi.Form", "fastapi.Cookie", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]   # fake secrets in tests are intentional
